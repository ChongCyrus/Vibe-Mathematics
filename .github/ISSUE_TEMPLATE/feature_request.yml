name: ✨ Feature / 优化建议
description: 新功能、架构优化、性能改进、文档建议（提交前请先搜索已有 Issue）
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎任何想法——**不要担心想法不成熟，任何反馈都有价值**。
        先搜索[已有 Issue](https://github.com/ChongCyrus/Vibe-Mathematics/issues)，重复的可以直接在旧 Issue 下补充场景。
  - type: dropdown
    id: kind
    attributes:
      label: 建议类型
      options:
        - 新功能
        - 架构优化
        - 性能优化（token / 调度 / 协作效率）
        - 文档改进
        - 新 preset 架构
        - 其他
    validations:
      required: true
  - type: dropdown
    id: preset
    attributes:
      label: 针对的预设
      options:
        - vibe-math-v2
        - vibe-math-v3
        - vibe-math-v4
        - vibe-math-v5
        - 通用 / 安装器 / 全部四套
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 当前有什么不足？你在什么情况下觉得别扭？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 你希望如何实现或改进？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案（建议）
      description: 你考虑过其他方案吗？各自的取舍？
    validations:
      required: false
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 谁会在什么场景下用到它？
    validations:
      required: false
  - type: textarea
    id: refs
    attributes:
      label: 补充说明
      description: 相关论文、参考项目、草图、截图等
    validations:
      required: false
