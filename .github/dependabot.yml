version: 2
updates:
  # The package itself has no runtime dependencies, but the repository's dev surface
  # (CI actions, any future devDependency) is kept current by Dependabot.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
