# dsh-vibe-math bundle patch — the profile layer this package contributes.
#
# It inserts the preset installer plus one agent-preset declaration per shipped preset, and it is
# GENERATED: edit scripts/build-preset-rows.mjs, not this file (tests/audit-preset-rows.test.mjs fails
# on drift).
#
# TWO DSH LINES, ONE FILE:
#   · DSH >= 0.1.7 — an agent preset is a composition row (`agentPresets.register({id,plugins,…})`).
#     The declarations below carry the full composition in `config.plugins` and name this package's
#     own preset-declaration.js, which performs that registration. The installer row then reports the
#     mechanism and skips the legacy directory.
#   · DSH <= 0.1.6 — nothing reads preset declarations; presets are directories under
#     <DSH_HOME>/.agent-presets, which the installer row writes (its directory branch). The four
#     declaration rows still load (they name our own module, which exists on both lines) but find no
#     `agentPresets` service and register nothing, so the older line boots without warnings.
#
# Composition source of truth: each preset's frozen vibe-math-vN/agent.cordis.yml. The only
# differences applied to it here:
#   · @deepseek-ai/dsh-workflow-worker-thread was removed after 0.1.6; @deepseek-ai/dsh-workflow-ptc replaces it
#   · the legacy `persona.text` key (kept in the frozen file for DSH <= 0.1.2) is unknown from 0.1.3 on — `prefix` carries the same text
#   · the framework row must name an installed package subpath: a declaration row's `name` is NOT rewritten to a file URL by app-boot (it only recurses into group configs), so a relative path would be resolved against the profile directory
#   · comment follows the row above (`./vibe-math-vN.js` → the package subpath)
#   · `command-goal` (the human's /goal) is part of every shipped full preset and must be declared in-preset to reach the agent's scoped command registry
#   · `present` (deliverable cards) has no host row — it must be declared inside the preset
#
# Usage of the installer row's bare specifier: `dsh-vibe-math/installer` resolves through the profile's
# node_modules (where this package is installed) and is exported by package.json.

- insert:
    - id: vibe-math-preset-installer
      name: dsh-vibe-math/installer

# ── Vibe Math V2 ──────────────────────────────────────────────────────────────
- insert:
    - id: preset-vibe-math-v2
      name: dsh-vibe-math/preset-declaration
      config:
        id: vibe-math-v2
        name: "Vibe Math V2"
        description: "多代理数学问题求解与验证框架（经典）：概率驱动调度 —— qs.json 问题清单 + Propos/ 命题库 + Reliable/ 参考文献，explorer 拆方向 → 逐方向 Solver 迭代 → 多验证器独立审查→辩论→裁决；断点续跑、人工/自动干预、file/push 双模式进度汇报。"
        order: 20
        plugins:
          # The `vibe-math-v2` agent preset: the full coding agent (`standard`), plus the
          # classic-architecture multi-agent mathematical problem-solving & verification
          # framework (see vibe-math-v2/实现方案.md).
          #
          # The vibe-math-v2 plugin row consumes the HOST subagents/agents/fs/tools/commands
          # services and publishes nothing, so it needs no isolate realm.

          # ── identity ────────────────────────────────────────────────────────────────

          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are a coding agent powered by the {{model}} model.

                ## Vibe Math V2 toolkit

                This session includes the "Vibe Math V2" multi-agent mathematical problem-solving and
                verification framework (classic architecture). It is driven by a background scheduler (code),
                NOT by the model: you only issue the control tools below and read status; the scheduler
                programmatically runs explorer (direction setting) → per-direction solvers (agent_self_iteration)
                → multi-reviewer independent review → debate → verdict, and promotes/updates data itself.

                - vibe_math_add_problem {id, description, priority} — add a problem to qs/qs.json.
                - vibe_math_add_proposition {id, 概述, 布尔估计, 优先级, 价值/关键性} — add a proposition to Propos/.
                - vibe_math_list_propositions — list the proposition knowledge base (summary index).
                - vibe_math_start / vibe_math_resume — start / resume the scheduler (resume = continue after a checkpoint or restart).
                - vibe_math_status / vibe_math_report — read scheduler status / full progress report (report also writes Progress_Logs/report.json).
                - vibe_math_pause / vibe_math_abort — pause / abort (abort interrupts all children).
                - vibe_math_set_mode {mode: manual|auto} — switch manual / auto control.
                - vibe_math_set_params {...} — tune any parameter (see vibe_math_setup for the full schema; e.g. reportMode file|push|both, promoteValueThreshold, verdictMode flat|forced, formalVerify off|encourage|require).
                - vibe_math_setup / vibe_math_save_settings / vibe_math_template — guided configuration / persist defaults / generate template.
                - vibe_math_new_project / vibe_math_set_project / vibe_math_list_projects — per-project folders.
                - vibe_math_list_decisions / vibe_math_decide {id, action: approve|reject|override, verdict?} — resolve manual decisions.
                - vibe_math_list_agents / vibe_math_message_agent / vibe_math_interrupt_agent — inspect / steer / interrupt subagents.
                - vibe_math_lean_run / vibe_math_lean_archive / vibe_math_lean_lib — Lean formal
                  verification (execute / archive / list the reuse library). The scheduler's child agents
                  use them too; they work in every mode.

                A /vibe slash command mirrors the main controls. Data lives under {{cwd}}/VibeMath/Projects/<project>/
                (qs/qs.json, Propos/<分类>_Propos.json, Reliable/, Verified/, Verification_logs/, Progress_Logs/, VibeMath_State/)
                and survives restarts via vibe_math_resume.

                Key rules to remember when reporting: a problem is "solved" when one of its solutions reaches
                正确概率 = 1; a proposition reaches 布尔估计 = 1/0 when a proof/refutation in its lists reaches
                正确概率 = 1; Propos propositions with 价值/关键性 ≥ promoteValueThreshold auto-promote to qs.json.
                Closure rule (identical across the presets): the 1/0 values above are written ONLY by the scheduler,
                after ≥2 independent verifier agents settle the object (one lone reviewer can never conclude), and
                Verified/ is written by that same scheduler path — an agent's own self-reported 1 is never a conclusion.
                When the user asks about progress, call vibe_math_report and summarize in plain language.

                Configuration highlights (all tunable via vibe_math_set_params / the settings file):
                `knowledgeContext` overrides the shared data-model explanation injected into every child prompt
                (empty = built-in full version); `explorerPersona` / `solverPersona` / `verifierPersona` prepend
                role instructions; `solverAllowNetwork` / `verifierAllowNetwork` / `solverAllowScripts` /
                `verifierAllowScripts` toggle network / script tools (empty = inherit, true = allow, false = deny);
                `directionsPerSolver` = how many directions each solver's prompt includes (1 = own direction only).
                Data behaviors: an auto-promoted proposition becomes the problem "判断下述命题是否成立：<命题>"
                with its proofs/refutations transferred into the solution list (verification results sync back to the
                source proposition); a solver-reported sub-question q_sub registers THREE objects — the q_sub problem,
                the temporary-assumption proposition p_{q-tmp}, and the problem "判断下述命题是否成立：p_{q-tmp}".

                LEAN FORMAL VERIFICATION (formalVerify, a tunable parameter):
                  - 'off' (default, no extra requirement) | 'encourage' (solver/verifier agents decide by
                    implementation difficulty whether to formalize in Lean; once a Lean run passes, the review
                    subject becomes FIDELITY — do the Lean definitions/objects/conditions/assumptions/conclusion
                    match the proposition as stated) | 'require' (same, plus a gate: a true/false verdict is
                    recorded as 未定论 with reason formal-required until the object is Lean-passed or carries an
                    explicit, reasoned blocker record; the scheduler is never wedged by it).
                  - Paths: work file Formal/<id>.lean; archived proof Verified/Lean/<id>.lean; reusable
                    definitions VibeMath/Formal/Lib/; proved lemmas VibeMath/Formal/Proved/.
                  - The toolchain knobs leanCommand / leanArgs / leanTimeoutMs are tunable as well
                    (e.g. leanCommand='lake' with leanArgs=['env','lean']); a missing Lean binary is
                    reported as LEAN_NOT_FOUND and still lets the code be written and archived.
                  - vibe_math_status / vibe_math_report show the mode, the per-object formal status and the
                    formalization TODO (Formal/TODO.md). The framework never installs Lean and never judges
                    fidelity for you.
              suffix: Your working directory is {{cwd}}.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ── shell ───────────────────────────────────────────────────────────────────

          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── filesystem ──────────────────────────────────────────────────────────────

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── background jobs ────────────────────────────────────────────────────────

          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── skills ──────────────────────────────────────────────────────────────────

          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── goals ───────────────────────────────────────────────────────────────────

          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'

          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          # ── plan mode ───────────────────────────────────────────────────────────────

          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                        You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                        Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                        The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                        Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                        Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                        When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

          # ── compaction ──────────────────────────────────────────────────────────────

          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── delegation and workflows ────────────────────────────────────────────────

          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  backgroundMode: continuable

              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable

              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn

              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                config:
                  subagentProvider: spawn
                  maxRounds: 64

          # ── remaining model-facing rows ─────────────────────────────────────────────

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: false
              searchTimeoutMs: 60000

          - id: present
            name: '@deepseek-ai/dsh-tool-present'

          # ── Vibe Math V2 ────────────────────────────────────────────────────────────

          # The classic-architecture framework: this package's plugin (dsh-vibe-math/vibe-math-v2/vibe-math-v2.js)
          # that registers the vibe_math_* tools, a /vibe slash command, and a background
          # scheduler (explorer → per-direction solvers → multi-reviewer verification).
          # It consumes the HOST subagents/agents/fs/tools/commands services and provides
          # nothing, so it sits loose (no isolate realm).
          - id: vibe-math-v2
            name: 'dsh-vibe-math/vibe-math-v2/vibe-math-v2.js'


# ── Vibe Math V3 ──────────────────────────────────────────────────────────────
- insert:
    - id: preset-vibe-math-v3
      name: dsh-vibe-math/preset-declaration
      config:
        id: vibe-math-v3
        name: "Vibe Math V3"
        description: "多代理数学研究与验证框架（第三代架构）：论文式 Markdown 知识库（Problems/ 问题清单+依赖+来源动机、Progress/ 研究日志、Propos/ 命题库、Methods/ 通用理论发明库、Verified/ 绝对可信）+ 规划代理自主调度（一次安排接下来 n 次各代理任务）+ 方法库沉淀循环（Method Keeper 提炼理论/框架/工具/方法/思想）；断点续跑、人工/自动干预、多会话并行隔离。"
        order: 21
        plugins:
          # The `vibe-math-v3` agent preset: the full coding agent (`standard`), plus the
          # THIRD-generation multi-agent mathematical problem-solving & verification
